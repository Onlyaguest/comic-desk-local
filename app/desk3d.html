<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 工作台 · 本地</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#171310;--paper:#fff8e1}
  html,body{margin:0;height:100%;background:#1d1830;overflow:hidden;font-family:"Comic Neue","PingFang SC",sans-serif;color:var(--ink)}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #c:active{cursor:grabbing}
  .top{position:fixed;left:16px;top:14px;display:flex;gap:10px;align-items:center;z-index:2;flex-wrap:wrap}
  .pill{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;text-decoration:none;color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;font-size:14px;font-family:inherit}
  .pill.on{background:#ff6fb1}
  .title{font-family:Bangers,"PingFang SC",sans-serif;font-size:26px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:2px 12px;box-shadow:3px 3px 0 var(--ink)}
  .tip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:6px 14px;font-size:14px;z-index:2;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
  .info{position:fixed;right:16px;bottom:14px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:13px;z-index:2;box-shadow:3px 3px 0 var(--ink);max-width:300px}
  #loading{position:fixed;inset:0;display:grid;place-items:center;font-family:Bangers,sans-serif;font-size:32px;color:#fff;z-index:3;transition:opacity .4s;pointer-events:none}
  #loading.hide{opacity:0}
</style>
<script type="importmap">
{ "imports": { "three": "./assets/vendor3d/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <span class="title">LOCAL · 3D 工作台</span>
  <a class="pill" href="index.html">← 回到漫画桌面</a>
  <button class="pill" id="reset">⟲ 复位视角</button>
  <button class="pill" id="auto">▶ 自动旋转</button>
</div>
<div class="tip">拖动旋转 · 滚轮缩放 · 右键平移</div>
<div class="info" id="info">加载中…</div>
<div id="loading">正在搭建 3D 桌面…</div>
<script src="js/desk3d-data.js"></script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './assets/vendor3d/GLTFLoader.js';
import { OrbitControls } from './assets/vendor3d/OrbitControls.js';

const ITEMS = window.DESK3D_ITEMS || [];
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1d1830');
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 1, 20000);
const HOME = new THREE.Vector3(0, 1650, 2050), TARGET = new THREE.Vector3(0, 200, 230);
camera.position.copy(HOME);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.minDistance = 500; controls.maxDistance = 4500;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0xfff4d6, 0x5a3520, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(700, 1700, 1500); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -1500, right: 1500, top: 1500, bottom: -1500, near: 10, far: 6000 });
sun.shadow.bias = -0.0006;
scene.add(sun);

// ---- 坐标：舞台 1600×1000 → 世界（1 单位 = 1 舞台像素）----
const toX = (sx) => sx - 800;
const TOP_OF_DESK = 632;                      // 桌面表面对应的舞台 y
const toY = (sy) => TOP_OF_DESK - sy;         // 桌面表面 y=0，往上为正
const DESK_Z0 = -110, DESK_Z1 = 510;          // 桌子景深范围（后 → 前）
const SHELF_Y = toY(510);                      // 搁板顶面
const SHELF_Z = -335;                          // 搁板深度
const WALL_Z = -496;                           // 墙面物件深度
// 2D 的 y 越大越靠前：把舞台 y ∈ [640, 1000] 映射到景深
const depthOf = (sy) => DESK_Z0 + (Math.min(Math.max(sy, 640), 1000) - 640) * (DESK_Z1 - DESK_Z0) / 360;

// ---- 房间 ----
const wall = new THREE.Mesh(new THREE.PlaneGeometry(4200, 1500),
  new THREE.MeshStandardMaterial({ color: '#f2c97a', roughness: 0.95 }));
wall.position.set(0, 300, -520); wall.receiveShadow = true; scene.add(wall);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(4200, 3200),
  new THREE.MeshStandardMaterial({ color: '#2a1b12', roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -700; floor.receiveShadow = true; scene.add(floor);

// ---- 桌子（舞台 left -20..1620，前缘 z=510）----
const DESK_W = 1660, DESK_D = DESK_Z1 - DESK_Z0 + 40;
const DESK_CZ = (DESK_Z0 + DESK_Z1) / 2;
const deskTop = new THREE.Mesh(new THREE.BoxGeometry(DESK_W, 40, DESK_D),
  new THREE.MeshStandardMaterial({ color: '#e0995a', roughness: 0.7 }));
deskTop.position.set(0, -20, DESK_CZ); deskTop.castShadow = true; deskTop.receiveShadow = true; scene.add(deskTop);
const deskFront = new THREE.Mesh(new THREE.BoxGeometry(DESK_W, 300, 40),
  new THREE.MeshStandardMaterial({ color: '#8a4a1c' }));
deskFront.position.set(0, -170, DESK_Z1 + 20); deskFront.castShadow = true; scene.add(deskFront);
for (const dx of [-DESK_W / 2 + 60, DESK_W / 2 - 60]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(60, 700, 60), new THREE.MeshStandardMaterial({ color: '#8a4a1c' }));
  leg.position.set(dx, -390, DESK_Z1 - 60); leg.castShadow = true; scene.add(leg);
}

// ---- 墙上的搁板（舞台 left 34, top 510, width 520）----
const plank = new THREE.Mesh(new THREE.BoxGeometry(520, 20, 170), new THREE.MeshStandardMaterial({ color: '#c96f2e' }));
plank.position.set(toX(34 + 260), SHELF_Y - 10, SHELF_Z); plank.castShadow = true; plank.receiveShadow = true; scene.add(plank);

// ---- 朝向：把薄物件的薄面转到正确方向 ----
const PERMS = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
const parity = (p) => { let s = 1; for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) if (p[i] > p[j]) s = -s; return s; };
function bestOrient(obj, kind, W, H) {
  // kind: 'stand'（薄面朝镜头 +z）/ 'lay'（薄面朝上 +y）
  const box = new THREE.Box3().setFromObject(obj);
  const sz = box.getSize(new THREE.Vector3());
  const d = [sz.x, sz.y, sz.z];
  const thin = d.indexOf(Math.min(...d));
  const target = kind === 'lay' ? 1 : 2;
  const want = W / H;
  let best = null;
  for (const p of PERMS) for (let m = 0; m < 8; m++) {
    const s = [m & 1 ? -1 : 1, m & 2 ? -1 : 1, m & 4 ? -1 : 1];
    if (parity(p) * s[0] * s[1] * s[2] !== 1) continue;      // 只要真旋转（det=+1）
    if (p[thin] !== target) continue;                         // 薄轴必须指向目标轴
    if (s[target] !== 1) continue;                            // 薄面的正面朝向 +目标轴
    const nd = [0, 0, 0]; for (let i = 0; i < 3; i++) nd[p[i]] = d[i];
    const a = nd[0], b = kind === 'lay' ? nd[2] : nd[1];
    const score = Math.abs(Math.log(a / b) - Math.log(want)) + (p.join() === '0,1,2' ? 0 : 0.02);
    if (!best || score < best.score) best = { score, p, s };
  }
  if (!best) return;
  const cols = [0, 1, 2].map((i) => {
    const v = new THREE.Vector3(); v.setComponent(best.p[i], best.s[i]); return v;
  });
  const M = new THREE.Matrix4().makeBasis(cols[0], cols[1], cols[2]);
  obj.quaternion.setFromRotationMatrix(M);
  obj.updateMatrixWorld(true);
}

// ---- 摆放：按 2D 尺寸缩放，底部贴地，居中到 2D 位置 ----
function fitAndPlace(obj, item) {
  obj.updateMatrixWorld(true);
  const sz = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
  const W = item.w, H = item.h;
  let S;
  if (item.kind === 'lay') {
    // 平放：宽=2D 宽，深=2D 高×1.2（透视补偿），非等比
    const sx = W / Math.max(sz.x, 1e-3), sz2 = (H * 1.2) / Math.max(sz.z, 1e-3);
    S = [sx, Math.min(sx, sz2), sz2];
  } else {
    const u = Math.min(W / Math.max(sz.x, 1e-3), H / Math.max(sz.y, 1e-3));
    S = [u, u, u];
  }
  const wrap = new THREE.Group();
  wrap.scale.set(S[0], S[1], S[2]);
  wrap.add(obj);
  scene.add(wrap);
  wrap.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(wrap);
  const c = b.getCenter(new THREE.Vector3());
  const cx = toX(item.x + item.w / 2);
  let baseY = 0, z;
  if (item.zone === 'shelf') { baseY = SHELF_Y; z = SHELF_Z; }
  else z = depthOf(item.y + item.h);
  // 水平居中到 2D 的 x；深度中心对齐；底部贴到 baseY
  wrap.position.set(cx - c.x, baseY - b.min.y, z - c.z);
  return wrap;
}

// 平面（墙画、日历、植物等）：贴图 + 透明边
const texLoader = new THREE.TextureLoader();
function placePlane(item) {
  return new Promise((resolve) => {
    texLoader.load(item.src, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      const aspect = tex.image.width / tex.image.height;
      const h = item.h, w = h * aspect;
      const m = new THREE.MeshStandardMaterial({ map: tex, transparent: true, alphaTest: 0.04, side: THREE.DoubleSide, roughness: 0.9 });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
      mesh.castShadow = true; mesh.position.y = h / 2;
      const g = new THREE.Group(); g.add(mesh);
      const onWall = item.zone === 'wall';
      if (item.zone === 'desk') {
        // 桌面立牌：底边贴桌面，景深按 2D 的底边 y 换算；lay=true 平放（卷轴）
        if (item.lay) { mesh.rotation.x = -Math.PI / 2; mesh.position.set(0, 2, 0); }
        g.position.set(toX(item.x + item.w / 2), 0, depthOf(item.y + item.h));
      } else {
        g.position.set(toX(item.x + item.w / 2), onWall ? toY(item.y + item.h) : SHELF_Y, onWall ? WALL_Z : SHELF_Z + 10);
      }
      scene.add(g); resolve(g);
    }, undefined, () => resolve(null));
  });
}

// 不做朝向调整的物件（立体的：杯子、台灯、耳机、鼠标、相机、笔筒、手办）
const KEEP = new Set(['camera', 'lamp', 'mug', 'pens', 'mouse', 'headphones', 'figure', 'figure2']);
const loader = new GLTFLoader();
const failed = [];
function loadModel(item) {
  return new Promise((resolve) => {
    loader.load(item.src, (gltf) => {
      const obj = gltf.scene;
      obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      if (!KEEP.has(item.n)) bestOrient(obj, item.kind, item.w, item.h);
      const placed = fitAndPlace(obj, item);
      if (item.n === 'monitor') addScreen(placed);
      resolve(placed);
    }, undefined, () => { failed.push(item.n); resolve(null); });
  });
}

// 显示器 GLB 的烘焙贴图里写着原作者的问候语；在屏幕位置贴一块本地屏幕（取自 2D 桌面的显示器）
// 2D 里屏幕占显示器包围盒：左 3.3%、上 4.0%、宽 93.6%、高 68.2%
function addScreen(wrap) {
  const b = new THREE.Box3().setFromObject(wrap);
  const W = b.max.x - b.min.x, H = b.max.y - b.min.y;
  texLoader.load('assets/desk3d/tex/screen.webp', (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    const sw = W * 0.90, sh = H * 0.60;
    const m = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false });
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), m);
    scr.position.set((b.min.x + b.max.x) / 2, b.max.y - H * 0.06 - sh / 2, b.max.z + 1.5);
    scene.add(scr);
  });
}

const info = document.getElementById('info');
const loading = document.getElementById('loading');
const jobs = ITEMS.map((it) => it.kind === 'plane' ? placePlane(it) : loadModel(it));
Promise.all(jobs).then((res) => {
  loading.classList.add('hide');
  const ok = res.filter(Boolean).length;
  info.textContent = `已加载 ${ok}/${ITEMS.length} 个物件` + (failed.length ? `（未载入：${failed.join('、')}）` : '');
});

// ---- 交互 ----
let auto = false;
const autoBtn = document.getElementById('auto');
autoBtn.onclick = () => { auto = !auto; controls.autoRotate = auto; autoBtn.classList.toggle('on', auto); };
document.getElementById('reset').onclick = () => { camera.position.copy(HOME); controls.target.copy(TARGET); controls.update(); };
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
</body>
</html>
