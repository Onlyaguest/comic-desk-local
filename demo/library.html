<!doctype html><html lang="zh-CN"><head><script src="./_demo/shim.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多端索引 · 我的工作台</title><link rel="stylesheet" href="./css/library.css"><link rel="stylesheet" href="./css/index-additions.css?v=2"></head><body>
<header><a class="back" href="./index.html">← 漫画桌面</a><span class="badge">LOCAL DESK</span><h1>对话有来处，作品找得到。</h1><p>Codex · Claude · Mirasim · Cohub · WorkBuddy — 在原来的地方继续，把入口留在这里。</p><div class="actions"><button id="refresh">刷新索引</button><button id="deep" class="secondary">补齐全部云端正文</button><button id="cancel" class="secondary" hidden>停止刷新</button><span id="job" role="status">正在读取本地索引…</span></div></header>
<main><section id="stats" aria-label="索引统计"></section><details class="coverage"><summary>数据来源与覆盖范围 <span id="pending"></span></summary><div id="sources"></div><p>本机记录只读；云端读取使用现有登录。索引保存在本机。回复结束不代表任务完成。首次历史回填可能较久，已完成部分会保留。</p><p>旧会话改名但未出现在最近活动中时，可手动校准目录；未变化的正文仍复用。</p><button id="reconcile" class="secondary">校准历史目录</button></details>
<div class="toolbar"><nav aria-label="目录类型"><button data-kind="sessions" aria-pressed="true">会话</button><button data-kind="artifacts" aria-pressed="false">产物与引用</button><button data-kind="images" aria-pressed="false">图片</button></nav><label class="search"><span class="sr">搜索</span><input id="q" placeholder="搜索标题、正文、项目或文件名" type="search"></label><label><span class="sr">来源</span><select id="source"><option value="">所有来源</option><option value="codex">Codex</option><option value="claude">Claude</option><option value="mirasim">Mirasim</option><option value="cohub">Cohub</option><option value="workbuddy">WorkBuddy</option></select></label><label class="date">从 <input id="from" type="date"></label><label class="date">到 <input id="to" type="date"></label></div>
<div class="columns"><section class="results"><div class="resulthead"><span id="count"></span><span id="loading"></span></div><div id="list"></div><div class="paging"><button id="prev" class="secondary">上一页</button><span id="page"></span><button id="next" class="secondary">下一页</button></div></section><aside id="detail"><div class="empty"><span>↖</span><h2>从一段对话开始</h2><p>选择会话，查看正文、项目位置和关联产物。也可以切到产物目录直接找文件。</p></div></aside></div></main><div id="toast" role="alert" hidden></div><script src="./js/library.js"></script></body></html>
